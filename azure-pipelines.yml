# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  #dockerRegistryServiceConnection: '6e376f56-6367-4af3-a493-2122a23ab743'
  dockerRegistryServiceConnection: DockerHelm
  #imageRepository: 'sampleapp'
  #containerRegistry: 'dockerhelm.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  agentName: 'homeAgent'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      name: Default
      demands: 
        - agent.name -equals $(agentName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

# Stage 2: Helm Deployment
- stage: Deploy
  displayName: "Deploy to Production"
  dependsOn: Build
  jobs:
    - deployment: HelmDeploy                 # 👈 must be 'deployment' instead of 'job'
      displayName: "Helm Deploy"
      environment: 'production'              # 👈 approvals/checks configured in Azure DevOps Environments
      pool:
        name: Default
      strategy:
        runOnce:
          deploy:
            steps:
              - task: HelmInstaller@1
                inputs:
                  helmVersionToInstall: 'latest'
                displayName: 'Install Helm'
              
              - script: |
                  echo "Using Kubernetes context: $(KUBE_CONTEXT)"
                  kubectl config use-context $(KUBE_CONTEXT)
                  helm upgrade --install sampleapp ./charts/sampleapp \
                    --namespace mynamespace \
                    --set image.repository=dockerhelm.azurecr.io/sampleapp \
                    --set image.tag=$(Build.BuildId)
                displayName: 'Deploy Helm Chart'

