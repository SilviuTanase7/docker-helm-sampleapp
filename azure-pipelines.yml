trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: DockerHelm
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  agentName: 'homeAgent'
  BUILD_CONFIGURATION: 'Release'
  PACKAGE_NAME: 'SampleApp'
  PACKAGE_VERSION: '$(Build.BuildNumber)'
  SBOM_NS_BASE: 'http://sbom.local'
  IMAGE_NAME: 'dockerhelm.azurecr.io/sampleapp:$(Build.BuildId)'

stages:
# -----------------------------
# Stage 1: Code Quality
# -----------------------------
- stage: CodeQuality
  displayName: 'Code Quality Checks'
  jobs:
  - job: LintAndFormat
    displayName: 'Run Linters and Formatters'
    pool:
      name: Default
      demands:
        - agent.name -equals $(agentName)
    steps:
    # Restore dependencies
    - script: dotnet restore
      displayName: 'Restore NuGet packages'

    # Check formatting (whitespace/indentation)
    - script: dotnet format whitespace --verify-no-changes
      displayName: 'Check code formatting'
      failOnStderr: true

    # Run analyzers (report warnings, do not fail pipeline)
    - script: dotnet format analyzers --verify-no-changes
      displayName: 'Run code analyzers'
      continueOnError: true
# -----------------------------
# Stage 2: Test
# -----------------------------
- stage: Test
  displayName: 'Run Unit Tests'
  jobs:
  - job: UnitTests
    displayName: 'Unit Tests'
    pool:
      name: Default
    steps:
      # Restore packages
      - script: dotnet restore SampleApp.sln
        displayName: 'Restore NuGet packages'

      # Run unit tests (no --no-build)
      - script: |
          echo "Running unit tests..."
          dotnet test SampleApp.Tests/SampleApp.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory $(System.DefaultWorkingDirectory)/TestResults
        displayName: 'Run Unit Tests'

      # Publish test results
      - task: PublishTestResults@2
        inputs:
          testResultsFiles: '$(System.DefaultWorkingDirectory)/TestResults/*.trx'
          testRunTitle: 'Unit Tests'
          mergeTestResults: true
          failTaskOnFailedTests: true
# -----------------------------
# Stage 3: IaC Scan
# -----------------------------
- stage: IaCScan
  displayName: "Helm IaC Scan"
  jobs:
  - job: HelmScanJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    # Install and run Checkov
    - script: |
        python3 -m pip install --upgrade pip
        pip install checkov
        checkov -d ./charts --output json --soft-fail > checkov-helm-report.json
      displayName: "Checkov Helm Scan"

    # Publish reports
    - publish: checkov-helm-report.json
      artifact: CheckovHelmReport

# -----------------------------
# Stage 4: Build & Docker
# -----------------------------
- stage: Build
  displayName: 'Build, Scan'
  jobs:
  - job: Build
    displayName: 'Build'
    pool:
      name: Default
      demands: 
        - agent.name -equals $(agentName)
        - java
    steps:
    # SonarQube preparation
    - task: SonarQubePrepare@7
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'SonarQubeDockerHelm'
        scannerMode: 'dotnet'
        projectKey: 'HOME_DockerHelm_0649997a-2597-4daa-bfa7-7214baa79d52'
        projectName: 'DockerHelm'
        extraProperties: |
          sonar.host.url=http://192.168.1.2:9000
          sonar.login=$(SONARQUBE_TOKEN)

    # Restore NuGet packages
    - script: dotnet restore --locked-mode
      displayName: 'Restore NuGet packages'

    # Vulnerability scan for .NET packages
    - script: dotnet list package --vulnerable
      displayName: 'Dependency Vulnerability Scan'

    # Build solution
    - script: dotnet build
      displayName: 'Build Solution'

    # Build & push Docker image
    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags:  |
          $(Build.BuildId)
          $(Build.SourceVersion)
          latest

    # Run SonarQube analysis
    - task: SonarQubeAnalyze@7
      displayName: 'Run SonarQube Analysis'

    # Publish SonarQube Quality Gate
    - task: SonarQubePublish@7
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

    # Add this step after your Docker build & push
    - script: |
        # Scan Docker image
        grype $IMAGE_NAME -o json > image-vulns.json

        # Count Critical/High CVSS vulnerabilities
        CRITICAL_COUNT=$(jq '[.matches[] | select(.vulnerability.severity=="Critical" or .vulnerability.severity=="High")] | length' image-vulns.json)
        echo "Critical/High vulnerabilities found: $CRITICAL_COUNT"

        if [ "$CRITICAL_COUNT" -gt 0 ]; then
          echo "❌ CVSS gating failed: deploy blocked"
          # exit 1
        fi
      displayName: 'CVSS Gating: Block deploy if critical vulnerabilities found'

    - publish: image-vulns.json
      artifact: CVSSScanReport
      displayName: 'Publish vulnerability scan report'
      condition: always()

    # 3. Fetch Cosign key from Key Vault
    - task: AzureKeyVault@2
      inputs:
        azureSubscription: 'CosignConnection'
        KeyVaultName: 'DockerHelm'
        SecretsFilter: 'cosign-private-key'
        RunAsPreJob: false

    # 4. Sign image with Cosign
    - script: |
        az acr login --name dockerhelm
        echo "Signing image $(IMAGE_NAME)"

        # Write Key Vault secret to a file
        echo "$COSIGN_KEY" > $(Pipeline.Workspace)/cosign.key

        DIGEST=$(az acr repository show-manifests \
          --name dockerhelm \
          --repository sampleapp \
          --query "[?tags[?@=='$(Build.BuildId)']].digest" -o tsv)
        echo "Signing image $IMAGE_NAME@$DIGEST"

        # (Optional) protect the file
        chmod 600 $(Pipeline.Workspace)/cosign.key

        # Sign the image with Cosign
        cosign sign --key $(Pipeline.Workspace)/cosign.key "$(IMAGE_NAME)@$DIGEST"
      env:
        COSIGN_KEY: $(cosign-private-key)  # secret pulled from Key Vault
      displayName: 'Sign Docker Image with Cosign'

    # 5. (Optional) Verify signature
    - script: |
        echo "Verifying signature for $(IMAGE_NAME)"
        cosign verify --key cosign.pub "$(IMAGE_NAME)"
      displayName: 'Verify Docker Image Signature'

# -----------------------------
# Stage 5: Artifact Management
# -----------------------------
- stage: ArtifactManagement
  displayName: "Artifact Management"
  dependsOn: 
    - Build
    - IaCScan
  jobs:
  - job: BundleArtifacts
    displayName: "Bundle & Publish All Artifacts"
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    # Download artifacts from earlier stages
    - download: current
      artifact: CheckovHelmReport
      displayName: "Download Checkov Report"

    - download: current
      artifact: CVSSScanReport
      displayName: "Download CVSS Report"

    # -----------------------------
    # Package Helm Chart
    # -----------------------------
    - script: |
        CHART_PATH=./charts/sampleapp
        VERSION="0.1.$(Build.BuildId)"
        echo "Updating Chart.yaml with version $VERSION"

        # Update Chart.yaml
        sed -i "s/^version:.*/version: $VERSION/" $CHART_PATH/Chart.yaml
        sed -i "s/^appVersion:.*/appVersion: \"$(Build.BuildId)\"/" $CHART_PATH/Chart.yaml
        # Force Chart.yaml name to lowercase
        sed -i 's/^name:.*/name: sampleapp/' $CHART_PATH/Chart.yaml

        # Package chart into staging directory
        helm package $CHART_PATH \
          --version $VERSION \
          --app-version $(Build.BuildId) \
          --destination $(Build.ArtifactStagingDirectory)

        # Copy Checkov + CVSS reports into staging dir
        cp $(Pipeline.Workspace)/CheckovHelmReport/checkov-helm-report.json $(Build.ArtifactStagingDirectory) || true
        cp $(Pipeline.Workspace)/CVSSScanReport/image-vulns.json $(Build.ArtifactStagingDirectory) || true
      displayName: "Package Helm Chart and Collect Reports"

    # -----------------------------
    # Publish everything as a single artifact
    # -----------------------------
    - publish: $(Build.ArtifactStagingDirectory)
      artifact: BuildArtifacts
      displayName: "Publish Unified Build Artifacts"

  # -----------------------------
  # Separate Job: Push Helm Chart
  # -----------------------------
  - job: PushHelmChart
    displayName: "Push Helm Chart to ACR"
    dependsOn: BundleArtifacts
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - download: current
        artifact: BuildArtifacts

      - task: AzureCLI@2
        displayName: "Push Helm Chart to ACR"
        inputs:
          azureSubscription: AzureRM-Home
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            CHART_PACKAGE=$(ls $(Pipeline.Workspace)/BuildArtifacts/sampleapp-*.tgz)
            echo "Chart package: $CHART_PACKAGE"

            # Login to ACR
            az acr login --name dockerhelm

            # Push chart to Helm OCI repo
            helm push $CHART_PACKAGE oci://dockerhelm.azurecr.io/helm

- stage: Deploy
  displayName: 'Deploy to Production'
  dependsOn:
    - Build
    - ArtifactManagement
  jobs:
  - deployment: HelmDeploy
    displayName: 'Helm Deploy'
    environment: 'production'
    pool:
      name: Default
    strategy:
      runOnce:
        deploy:
          steps:
          - task: HelmInstaller@1
            displayName: 'Install Helm'
            inputs:
              helmVersionToInstall: 'latest'

          - script: |
              echo "Logging in to ACR..."
              az acr login --name dockerhelm

              echo "Using Kubernetes context: $KUBE_CONTEXT"
              kubectl config use-context $KUBE_CONTEXT

              # Check if release exists and is stuck
              RELEASE_STATUS=$(helm status sampleapp -n mynamespace --output json | jq -r '.status' || echo "not-found")
              if [ "$RELEASE_STATUS" = "pending-install" ]; then
                echo "Stuck release detected, uninstalling..."
                helm uninstall sampleapp -n mynamespace
              fi

              echo "Deploying Helm chart from OCI..."
              helm upgrade --install sampleapp oci://dockerhelm.azurecr.io/helm/sampleapp \
                --namespace mynamespace \
                --version 0.1.$(Build.BuildId) \
                --set image.repository=dockerhelm.azurecr.io/sampleapp \
                --set image.tag=$(Build.BuildId) \
                --wait --timeout 10m --rollback-on-failure

              echo "Checking Pod status after deployment..."
              kubectl get pods -n mynamespace
              kubectl get events -n mynamespace --sort-by='.lastTimestamp'
            displayName: 'Deploy Helm Chart from OCI with Safety Checks'
