trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: DockerHelm
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  agentName: 'homeAgent'
  BUILD_CONFIGURATION: 'Release'
  PACKAGE_NAME: 'SampleApp'
  PACKAGE_VERSION: '$(Build.BuildNumber)'
  SBOM_NS_BASE: 'http://sbom.local'

stages:
# -----------------------------
# Stage 1: Code Quality
# -----------------------------
- stage: CodeQuality
  displayName: 'Code Quality Checks'
  jobs:
  - job: LintAndFormat
    displayName: 'Run Linters and Formatters'
    pool:
      name: Default
      demands:
        - agent.name -equals $(agentName)
    steps:
    # Restore dependencies
    - script: dotnet restore
      displayName: 'Restore NuGet packages'

    # Check formatting (whitespace/indentation)
    - script: dotnet format whitespace --verify-no-changes
      displayName: 'Check code formatting'
      failOnStderr: true

    # Run analyzers (report warnings, do not fail pipeline)
    - script: dotnet format analyzers --verify-no-changes
      displayName: 'Run code analyzers'
      continueOnError: true
# -----------------------------
# Stage 2: Test
# -----------------------------
- stage: Test
  displayName: 'Run Unit Tests'
  jobs:
  - job: UnitTests
    displayName: 'Unit Tests'
    pool:
      name: Default
    steps:
      # Restore packages
      - script: dotnet restore SampleApp.sln
        displayName: 'Restore NuGet packages'

      # Run unit tests (no --no-build)
      - script: |
          echo "Running unit tests..."
          dotnet test SampleApp.Tests/SampleApp.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory $(System.DefaultWorkingDirectory)/TestResults
        displayName: 'Run Unit Tests'

      # Publish test results
      - task: PublishTestResults@2
        inputs:
          testResultsFiles: '$(System.DefaultWorkingDirectory)/TestResults/*.trx'
          testRunTitle: 'Unit Tests'
          mergeTestResults: true
          failTaskOnFailedTests: true

- stage: SecretsScan
  displayName: "Secrets Scan Stage"
  jobs:
  - job: TruffleHogScan
    displayName: "Run TruffleHog Secrets Scan"
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self   # ensures the repo is available
      persistCredentials: true

    - script: |
        mkdir -p ./bin
        curl -sSL https://github.com/trufflesecurity/trufflehog/releases/download/v3.90.8/trufflehog_3.90.8_linux_arm64.tar.gz -o trufflehog.tar.gz
        tar -xzf trufflehog.tar.gz
        sudo mv trufflehog /usr/local/bin/
      displayName: "Install TruffleHog"

    - script: |
        echo "Running secrets scan..."
        trufflehog filesystem --json . > trufflehog-report.json || exit 1
      displayName: "Run TruffleHog v3 Scan"

    - publish: trufflehog-report.json
      artifact: TruffleHogReport
      displayName: "Publish TruffleHog Report"


# -----------------------------
# Stage 3: Build & Docker
# -----------------------------
- stage: Build
  displayName: 'Build, Scan'
  jobs:
  - job: Build
    displayName: 'Build'
    pool:
      name: Default
      demands: 
        - agent.name -equals $(agentName)
        - java
    steps:
    # SonarQube preparation
    - task: SonarQubePrepare@7
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarQube: 'SonarQubeDockerHelm'
        scannerMode: 'dotnet'
        projectKey: 'HOME_DockerHelm_0649997a-2597-4daa-bfa7-7214baa79d52'
        projectName: 'DockerHelm'
        extraProperties: |
          sonar.host.url=http://192.168.1.2:9000
          sonar.login=$(SONARQUBE_TOKEN)

    # Restore NuGet packages
    - script: dotnet restore --locked-mode
      displayName: 'Restore NuGet packages'

    # Vulnerability scan for .NET packages
    - script: dotnet list package --vulnerable
      displayName: 'Dependency Vulnerability Scan'

    # Build solution
    - script: dotnet build
      displayName: 'Build Solution'

    # Build & push Docker image
    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    # Run SonarQube analysis
    - task: SonarQubeAnalyze@7
      displayName: 'Run SonarQube Analysis'

    # Publish SonarQube Quality Gate
    - task: SonarQubePublish@7
      displayName: 'Publish SonarQube Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

    # Add this step after your Docker build & push
    - script: |
        IMAGE_NAME=dockerhelm.azurecr.io/sampleapp:$(Build.BuildId)

        # Scan Docker image
        grype $IMAGE_NAME -o json > image-vulns.json

        # Count Critical/High CVSS vulnerabilities
        CRITICAL_COUNT=$(jq '[.matches[] | select(.vulnerability.severity=="Critical" or .vulnerability.severity=="High")] | length' image-vulns.json)
        echo "Critical/High vulnerabilities found: $CRITICAL_COUNT"

        if [ "$CRITICAL_COUNT" -gt 0 ]; then
          echo "❌ CVSS gating failed: deploy blocked"
          # exit 1
        fi
      displayName: 'CVSS Gating: Block deploy if critical vulnerabilities found'

    - publish: image-vulns.json
      artifact: CVSSScanReport
      displayName: 'Publish vulnerability scan report'
      condition: always()

# -----------------------------
# Stage 4: Helm Deployment
# -----------------------------
- stage: Deploy
  displayName: 'Deploy to Production'
  dependsOn: Build
  jobs:
  - deployment: HelmDeploy
    displayName: 'Helm Deploy'
    environment: 'production'
    pool:
      name: Default
    strategy:
      runOnce:
        deploy:
          steps:
          - task: HelmInstaller@1
            displayName: 'Install Helm'
            inputs:
              helmVersionToInstall: 'latest'

          - script: |
              echo "Using Kubernetes context: $(KUBE_CONTEXT)"
              kubectl config use-context $(KUBE_CONTEXT)
              helm upgrade --install sampleapp ./charts/sampleapp \
                --namespace mynamespace \
                --set image.repository=dockerhelm.azurecr.io/sampleapp \
                --set image.tag=$(Build.BuildId)
            displayName: 'Deploy Helm Chart'